# GitHub Actions workflow: build and deploy Angular app to GitHub Pages
# Triggers on pushes to the main branch and deploys the production build artifacts
# Uses the official GitHub Pages actions for artifact upload and deploy

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Optional lint (recommended)
        run: |
          npm run lint || true

      - name: Compute base href for GitHub Pages
        id: base-href
        run: |
          REPO_NAME=${{ github.event.repository.name }}
          if [ -f CNAME ]; then
            echo "CNAME found - using root base href"
            echo "BASE_HREF=/" >> $GITHUB_OUTPUT
          elif [[ "$REPO_NAME" == *.github.io ]]; then
            echo "BASE_HREF=/" >> $GITHUB_OUTPUT
          else
            echo "BASE_HREF=/${REPO_NAME}/" >> $GITHUB_OUTPUT
          fi

      - name: Build (production)
        env:
          BASE_HREF: ${{ steps.base-href.outputs.BASE_HREF }}
        run: |
          echo "Building with base-href=$BASE_HREF"
          npx ng build --configuration production --base-href "$BASE_HREF"

      - name: Copy CNAME for custom domain (if present)
        run: |
          if [ -f CNAME ]; then
            echo "CNAME found - copying to dist/ to configure custom domain"
            cp CNAME dist/CNAME
          else
            echo "No CNAME file present"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
