<section class="kitchen-login-page">
  <mat-card class="login-card">
    <h1>{{ 'KITCHEN.FORM.LOGIN_TITLE' | translate }}</h1>
    <p>{{ 'KITCHEN.FORM.LOGIN_SUBTITLE' | translate }}</p>

    <form (ngSubmit)="login()">
      <mat-form-field appearance="outline">
        <mat-label>{{ 'KITCHEN.FORM.EMAIL' | translate }}</mat-label>
        <input matInput required type="email" [(ngModel)]="email" name="email" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>{{ 'KITCHEN.FORM.PASSWORD' | translate }}</mat-label>
        <input matInput required type="password" [(ngModel)]="password" name="password" />
      </mat-form-field>

      <div class="login-actions">
        <button mat-raised-button color="primary" type="submit" [disabled]="loading()">{{ loading() ? ('KITCHEN.FORM.LOGIN_LOADING' | translate) : ('KITCHEN.FORM.LOGIN_ACTION' | translate) }}</button>
      </div>

      <div class="error-message" *ngIf="error()">{{ error() }}</div>
    </form>
  </mat-card>
</section>
