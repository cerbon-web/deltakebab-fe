<section class="kitchen-select-branch">
  <mat-card>
    <h2>{{ 'KITCHEN.SELECT_BRANCH.TITLE' | translate }}</h2>
    <p *ngIf="error" class="error">{{ error }}</p>

    <div *ngIf="loading">Loading branches…</div>
    <ul *ngIf="!loading">
      <li *ngFor="let b of branches">
        <div>{{ b.name }} — {{ b.address }}</div>
        <button mat-button color="primary" (click)="select(b)">Select</button>
      </li>
    </ul>
  </mat-card>
</section>
